[project]
name = "catan-ai"
version = "0.1.0"
description = "A reproducible Catan-like game engine, AI lab, and web player"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
catan-server = "catan_ai.api:main"
catan-sim = "catan_ai.sim:main"
catan-experiment = "catan_ai.experiments:main"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "ijson>=3.6.0",
    "pytest>=8",
]
solver = ["z3-solver==4.15.4.0"]
native = [
    "cython>=3.2,<4",
    "setuptools>=80",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catan_ai"]
exclude = ["*.so", "*.pyd", "_native_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "runs", "web", "scripts/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E731", "E741", "B008", "B011", "B905"]
